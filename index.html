<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - Stream en Vivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #18181b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d30;
        }
        header h1 { font-size: 18px; color: #00ff7f; }
        .config-btn {
            background: #53fc18;
            color: #000;
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .left-panel {
            width: 26%;
            background-color: #1f1f23;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #2d2d30;
        }
        .stream-box { height: 40%; background: #000; }
        .chat-info { flex: 1; padding: 15px; font-size: 14px; color: #adadb8; }
        
        .center-panel {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .right-panel {
            width: 22%;
            background-color: #18181b;
            border-left: 2px solid #2d2d30;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <h1 id="titulo-sala">Watch Party en Vivo</h1>
        <button class="config-btn" onclick="cambiarConfig()">Cambiar Canales</button>
    </header>

    <div class="main-container">
        <!-- Panel Izquierdo: Tu stream de Kick -->
        <div class="left-panel">
            <div class="stream-box">
                <iframe id="frame-stream" allowfullscreen="true"></iframe>
            </div>
            <div class="chat-info">
                <p>💡 <b>Nota:</b> Aquí se proyecta la pantalla de la app (Stremio/Netflix) en tiempo real para que tu comunidad la vea sin que Kick te detecte copyright.</p>
            </div>
        </div>

        <!-- Panel Central: Pantalla compartida en tiempo real -->
        <div class="center-panel">
            <!-- Usamos un iframe dinámico para la fuente de video en vivo o pantalla compartida -->
            <iframe id="frame-pantalla" allow="camera; microphone; display-capture; fullscreen"></iframe>
        </div>

        <!-- Panel Derecho: Chat de Kick -->
        <div class="right-panel">
            <iframe id="frame-chat" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        // Parámetros de la URL: ?user=TuKick&room=IdDeSalaEnVivo
        const params = new URLSearchParams(window.location.search);
        let user = params.get('user');
        let room = params.get('room');

        if (!user) {
            user = prompt("Ingresa tu usuario de Kick:") || "tu_usuario";
        }
        if (!room) {
            room = prompt("Ingresa el identificador de tu sala de transmisión (ej: sala-secreta-123):") || "sala-default";
        }

        // Configurar elementos visuales
        document.getElementById("titulo-sala").innerText = "Sala de: " + user;
        document.getElementById("frame-stream").src = `https://player.kick.com/${user}?muted=false`;
        document.getElementById("frame-chat").src = `https://kick.com/${user}/chatroom`;
        
        // Aquí conectamos el panel central a una plataforma de WebRTC libre o servicio de iframe en vivo (Ej: Jitsi Meet incrustado u otro servicio de mirror)
        // Puedes usar un servicio gratuito de salas de video open source cambiando esta URL base:
        document.getElementById("frame-pantalla").src = `https://meet.jit.si/${room}#config.startWithAudioMuted=true&config.startWithVideoMuted=true&interfaceConfig.TOOLBAR_BUTTONS=['microphone','camera','desktop','fullscreen']`;

        function cambiarConfig() {
            let nuevoUser = prompt("Usuario de Kick:", user);
            let nuevaSala = prompt("ID de la sala en vivo:", room);
            if (nuevoUser && nuevaSala) {
                window.location.href = `?user=${encodeURIComponent(nuevoUser)}&room=${encodeURIComponent(nuevaSala)}`;
            }
        }
    </script>
</body>
</html>
