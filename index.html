<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #setup-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #18181b;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            border: 1px solid #2d2d30;
            text-align: center;
        }
        .modal-box h2 { color: #53fc18; margin-bottom: 15px; font-size: 20px; }
        .modal-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0e0e10;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
        }
        .modal-box button {
            background: #53fc18;
            color: black;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

        .workspace {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .left-panel {
            width: 28%;
            background-color: #18181b;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d30;
        }
        .stream-box {
            height: 50%;
            background: #000;
        }
        .info-box {
            flex: 1;
            padding: 20px;
            font-size: 13px;
            color: #777;
            background: #0e0e10;
        }

        .center-panel {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="setup-modal">
        <div class="modal-box">
            <h2>Entrar al Stream</h2>
            <input type="text" id="kick-user" placeholder="Usuario de Kick del streamer">
            <input type="text" id="room-id" placeholder="Nombre de la sala de la película">
            <button onclick="entrar()">Ver Película</button>
        </div>
    </div>

    <div class="workspace">
        <div class="left-panel">
            <div class="stream-box">
                <iframe id="frame-stream" allowfullscreen="true"></iframe>
            </div>
            <div class="info-box">
                <p>Disfruta la película junto al streamer. El audio y la cámara provienen de su canal de Kick mientras proyecta la película en la pantalla principal.</p>
            </div>
        </div>

        <div class="center-panel">
            <iframe id="frame-pantalla" allow="display-capture; fullscreen"></iframe>
        </div>
    </div>

    <script>
        function entrar() {
            let user = document.getElementById("kick-user").value.trim();
            let room = document.getElementById("room-id").value.trim();
            if(!user || !room) {
                alert("Llena los datos.");
                return;
            }
            window.location.href = `?user=${encodeURIComponent(user)}&room=${encodeURIComponent(room)}`;
        }

        const params = new URLSearchParams(window.location.search);
        let user = params.get('user');
        let room = params.get('room');

        if(user && room) {
            document.getElementById("setup-modal").style.display = "none";
            document.getElementById("frame-stream").src = `https://player.kick.com/${user}?muted=false`;
            
            // Configuración automática para entrar de forma anónima sin cuentas ni pantallas de registro
            let jitsiUrl = `https://meet.jit.si/${room}#config.startWithAudioMuted=true&config.startWithVideoMuted=true&config.prejoinPageEnabled=false&config.disableDeepLinking=true&userInfo.displayName="Espectador"`;
            document.getElementById("frame-pantalla").src = jitsiUrl;
        }
    </script>
</body>
</html>
