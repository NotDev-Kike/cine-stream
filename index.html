<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - Stream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Ventana de configuración inicial genérica */
        #setup-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #18181b;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            border: 1px solid #2d2d30;
            text-align: center;
        }
        .modal-box h2 { color: #53fc18; margin-bottom: 15px; font-size: 20px; }
        .modal-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0e0e10;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
        }
        .modal-box button {
            background: #53fc18;
            color: black;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Estructura Principal a 2 columnas */
        .workspace {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. Panel Izquierdo: Tu stream de Kick (Cámara y Audio) */
        .left-panel {
            width: 28%;
            background-color: #18181b;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d30;
        }
        .stream-box {
            height: 50%;
            background: #000;
        }
        .info-box {
            flex: 1;
            padding: 20px;
            font-size: 14px;
            color: #888;
            background: #0e0e10;
            line-height: 1.5;
        }

        /* 2. Panel Central: Pantalla gigante para ver la película o app compartida */
        .center-panel {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- MODAL DE CONFIGURACIÓN AUTOMÁTICA -->
    <div id="setup-modal">
        <div class="modal-box">
            <h2>Configurar Watch Party</h2>
            <input type="text" id="kick-user" placeholder="Tu usuario de Kick (ej: tu_canal)">
            <input type="text" id="room-id" placeholder="Nombre de sala (ej: mipeliprivada)">
            <button onclick="entrarSala()">Iniciar Sala</button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div class="workspace">
        <!-- Izquierda: Stream de Kick -->
        <div class="left-panel">
            <div class="stream-box">
                <iframe id="frame-stream" allowfullscreen="true"></iframe>
            </div>
            <div class="info-box">
                <p>💡 <b>Cómo usar:</b></p><br>
                <p>1. Aquí te escuchan y ven por tu directo de Kick.</p><br>
                <p>2. En la pantalla de la derecha, comparte la ventana de <b>Stremio, Netflix</b> o tu PC para ver la película con tu gente sin riesgos de copyright.</p>
            </div>
        </div>

        <!-- Centro: Pantalla compartida en tiempo real -->
        <div class="center-panel">
            <iframe id="frame-pantalla" allow="camera; microphone; display-capture; fullscreen"></iframe>
        </div>
    </div>

    <script>
        function entrarSala() {
            let user = document.getElementById("kick-user").value.trim();
            let room = document.getElementById("room-id").value.trim();
            if(!user || !room) {
                alert("Por favor rellena ambos campos.");
                return;
            }
            window.location.href = `?user=${encodeURIComponent(user)}&room=${encodeURIComponent(room)}`;
        }

        // Cargar datos si ya están en la URL
        const params = new URLSearchParams(window.location.search);
        let user = params.get('user');
        let room = params.get('room');

        if(user && room) {
            document.getElementById("setup-modal").style.display = "none";
            document.getElementById("frame-stream").src = `https://player.kick.com/${user}?muted=false`;
            // Pantalla central interactiva para compartir Stremio, Netflix o tu pantalla
            document.getElementById("frame-pantalla").src = `https://meet.jit.si/${room}#config.startWithAudioMuted=true&config.startWithVideoMuted=true`;
        }
    </script>
</body>
</html>
