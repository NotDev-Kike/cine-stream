<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #setup-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #18181b;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            border: 1px solid #2d2d30;
            text-align: center;
        }
        .modal-box h2 { color: #53fc18; margin-bottom: 15px; font-size: 20px; }
        .modal-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0e0e10;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
        }
        .modal-box button {
            background: #53fc18;
            color: black;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

        .workspace {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .left-panel {
            width: 25%;
            background-color: #18181b;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d30;
        }
        .stream-box {
            height: 45%;
            background: #000;
        }
        .info-box {
            flex: 1;
            padding: 20px;
            font-size: 13px;
            color: #777;
            background: #0e0e10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .btn-streamer {
            background: #53fc18;
            color: black;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-streamer:hover { background: #45d613; }

        .center-panel {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="setup-modal">
        <div class="modal-box">
            <h2>Entrar al Stream</h2>
            <input type="text" id="kick-user" placeholder="Usuario de Kick del streamer">
            <input type="text" id="room-id" placeholder="Nombre de la sala de la película">
            <button onclick="entrar()">Entrar a la Sala</button>
        </div>
    </div>

    <div class="workspace">
        <div class="left-panel">
            <div class="stream-box">
                <iframe id="frame-stream" allowfullscreen="true"></iframe>
            </div>
            <div class="info-box">
                <p>Disfruta la película junto al streamer. El audio y la cámara provienen de su canal de Kick.</p>
                <div>
                    <p style="color: #53fc18; margin-bottom: 5px; font-weight: bold;">¿Eres el Streamer?</p>
                    <button class="btn-streamer" onclick="cambiarAModoEmisor()">Transmitir mi Pantalla Aquí</button>
                    <button class="btn-streamer" style="background:#333; color:#fff; margin-top:5px;" onclick="cambiarAModoEspectador()">Ver como Espectador</button>
                </div>
            </div>
        </div>

        <div class="center-panel">
            <iframe id="frame-pantalla" allow="display-capture; fullscreen; camera; microphone"></iframe>
        </div>
    </div>

    <script>
        function entrar() {
            let user = document.getElementById("kick-user").value.trim();
            let room = document.getElementById("room-id").value.trim();
            if(!user || !room) {
                alert("Llena los datos.");
                return;
            }
            window.location.href = `?user=${encodeURIComponent(user)}&room=${encodeURIComponent(room)}`;
        }

        const params = new URLSearchParams(window.location.search);
        let user = params.get('user');
        let room = params.get('room');

        if(user && room) {
            document.getElementById("setup-modal").style.display = "none";
            document.getElementById("frame-stream").src = `https://player.kick.com/${user}?muted=false`;
            
            // Por defecto, al entrar carga el modo espectador limpio para que se vea la película al transmitir
            document.getElementById("frame-pantalla").src = `https://vdo.ninja/?view=${room}&clean&scale=0&autostart`;
        }

        // Convierte el panel central en tu consola para elegir qué compartir sin tocar la cámara
        function cambiarAModoEmisor() {
            if(!room) return;
            document.getElementById("frame-pantalla").src = `https://vdo.ninja/?push=${room}&screenshare&autostart`;
        }

        // Regresa la pantalla central a la vista de la película ya transmitida
        function cambiarAModoEspectador() {
            if(!room) return;
            document.getElementById("frame-pantalla").src = `https://vdo.ninja/?view=${room}&clean&scale=0&autostart`;
        }
    </script>
</body>
</html>
