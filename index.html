<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - Stream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal de 3 columnas */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        /* 1. Panel Izquierdo (Cámara arriba + Chat de Kick abajo) */
        .left-panel {
            width: 24%;
            background-color: #18181b;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d30;
        }
        .cam-box {
            height: 35%;
            background: #000;
        }
        .chat-overlay-box {
            flex: 1;
            position: relative;
            background: #0e0e10;
        }

        /* 2. Panel Central (Título de la película + Pantalla compartida grande) */
        .center-panel {
            flex: 1;
            background-color: #000;
            display: flex;
            flex-direction: column;
        }
        .movie-title-bar {
            height: 45px;
            background-color: #0e0e10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #a991f7;
            border-bottom: 1px solid #1f1f23;
        }
        .movie-screen {
            flex: 1;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. Panel Derecho (Chat completo de Kick) */
        .right-panel {
            width: 20%;
            background-color: #18181b;
            border-left: 1px solid #2d2d30;
            display: flex;
            flex-direction: column;
        }

        /* Barra Inferior (Botones de Suscripción) */
        footer {
            height: 55px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #222;
        }
        .btn-twitch {
            background-color: #9146ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-kick {
            background-color: #53fc18;
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="workspace">
        <!-- 1. Izquierda: Tu cámara arriba y chat de Kick abajo -->
        <div class="left-panel">
            <div class="cam-box">
                <iframe id="frame-stream" allowfullscreen="true"></iframe>
            </div>
            <div class="chat-overlay-box">
                <iframe id="frame-chat-left" scrolling="no"></iframe>
            </div>
        </div>

        <!-- 2. Centro: Título de la película y la pantalla compartida (Stremio/Netflix) -->
        <div class="center-panel">
            <div class="movie-title-bar" id="titulo-pelicula">
                SPAIDY - NO WRY HOME
            </div>
            <div class="movie-screen">
                <iframe id="frame-pantalla" allow="camera; microphone; display-capture; fullscreen"></iframe>
            </div>
        </div>

        <!-- 3. Derecha: Chat principal de Kick completo -->
        <div class="right-panel">
            <iframe id="frame-chat-right" scrolling="no"></iframe>
        </div>
    </div>

    <!-- Barra inferior con botones de suscripción -->
    <footer>
        <button class="btn-twitch" onclick="alert('Enlace de suscripción a Twitch')">Suscribirse en Twitch</button>
        <button class="btn-kick" onclick="alert('Enlace de suscripción a Kick')">Suscribirse en Kick</button>
    </footer>

    <script>
        // Configuración automática por parámetros de la URL
        // Ejemplo de uso: tudominio.com/?user=TuCanal&room=sala123&movie=SPAIDY+-+NO+WAY+HOME
        const params = new URLSearchParams(window.location.search);
        let user = params.get('user') || prompt("Ingresa tu usuario de Kick:") || "tu_usuario";
        let room = params.get('room') || prompt("Ingresa el ID de la sala de video en vivo:") || "sala-default";
        let movieName = params.get('movie') || "SPAIDY - NO WAY HOME";

        // Asignación de elementos
        document.getElementById("titulo-pelicula").innerText = movieName;
        document.getElementById("frame-stream").src = `https://player.kick.com/${user}?muted=false`;
        document.getElementById("frame-chat-left").src = `https://kick.com/${user}/chatroom`;
        document.getElementById("frame-chat-right").src = `https://kick.com/${user}/chatroom`;
        
        // Pantalla central compartida (aquí compartes Stremio o Netflix)
        document.getElementById("frame-pantalla").src = `https://meet.jit.si/${room}#config.startWithAudioMuted=true&config.startWithVideoMuted=true&interfaceConfig.TOOLBAR_BUTTONS=['microphone','camera','desktop','fullscreen']`;
    </script>
</body>
</html>
