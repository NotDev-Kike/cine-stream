<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - Stream & Película</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Pantalla de configuración inicial */
        #setup-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #18181b;
            padding: 30px;
            border-radius: 8px;
            width: 380px;
            border: 1px solid #2d2d30;
            text-align: center;
        }
        .modal-box h2 { color: #53fc18; margin-bottom: 15px; font-size: 20px; }
        .modal-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0e0e10;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
        }
        .modal-box button {
            background: #53fc18;
            color: black;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }

        .workspace {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel izquierdo para el streamer (controles) */
        .left-panel {
            width: 28%;
            background-color: #18181b;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d30;
        }
        .stream-box {
            height: 40%;
            background: #000;
        }
        .info-box {
            flex: 1;
            padding: 20px;
            font-size: 13px;
            color: #aaa;
            background: #0e0e10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .btn-streamer {
            background: #53fc18;
            color: black;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-streamer:hover { background: #45d613; }

        .link-box {
            background: #18181b;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-size: 11px;
            word-break: break-all;
            color: #53fc18;
        }

        /* Panel principal (La película en grande) */
        .center-panel {
            flex: 1;
            background-color: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Widget flotante de promoción arriba a la derecha, más visible y grande */
        .promo-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            height: 200px;
            background: #18181b;
            border: 2px solid #53fc18;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }
        .promo-header {
            background: #2d2d30;
            color: #53fc18;
            font-size: 11px;
            font-weight: bold;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .promo-header a { color: #00d2ff; text-decoration: none; }
    </style>
</head>
<body>

    <!-- Ventana de inicio para introducir tus datos -->
    <div id="setup-modal">
        <div class="modal-box">
            <h2>Configurar Watch Party</h2>
            <input type="text" id="kick-user" placeholder="Tu usuario de Kick (ej. tu_usuario)">
            <input type="text" id="room-id" placeholder="Nombre de sala (ej. peliluis)">
            <button onclick="entrar()">Iniciar Panel</button>
        </div>
    </div>

    <div class="workspace">
        <!-- Panel de control privado del Streamer -->
        <div class="left-panel">
            <div class="stream-box">
                <iframe id="frame-stream" allowfullscreen="true"></iframe>
            </div>
            <div class="info-box">
                <div>
                    <p style="color:#fff; font-weight:bold; margin-bottom:5px;">Controles:</p>
                    <button class="btn-streamer" onclick="modoCompartir()">Compartir Pantalla (Película)</button>
                    
                    <p style="color: #fff; margin-top: 15px; margin-bottom: 3px; font-weight: bold; font-size:11px;">Enlace para tus Viewers:</p>
                    <button class="btn-streamer" style="background:#ff9900; margin-top:0;" onclick="copiarLinkViewer()">Copiar Link para el Chat</button>
                    <div id="viewer-link-display" class="link-box">Generando...</div>
                </div>
                <p style="font-size:11px; color:#666;">Los viewers verán la peli y tu stream flotando arriba a la derecha.</p>
            </div>
        </div>

        <!-- Pantalla gigante donde se proyecta la película de VDO.Ninja -->
        <div class="center-panel">
            <iframe id="frame-pantalla" allow="display-capture; fullscreen; autoplay"></iframe>

            <!-- Ventana flotante arriba a la derecha mejorada y más visible -->
            <div class="promo-overlay" id="promo-container" style="display:none;">
                <div class="promo-header">
                    <span>🔴 EN VIVO EN KICK</span>
                    <a id="promo-link" href="#" target="_blank">Canal ↗</a>
                </div>
                <iframe id="frame-promo-kick" allowfullscreen="true"></iframe>
            </div>
        </div>
    </div>

    <script>
        function entrar() {
            let user = document.getElementById("kick-user").value.trim();
            let room = document.getElementById("room-id").value.trim();
            room = room.toLowerCase().replace(/[^a-z0-9]/g, '_');
            
            if(!user || !room) {
                alert("Llena los datos correctamente.");
                return;
            }
            window.location.href = `?user=${encodeURIComponent(user)}&room=${encodeURIComponent(room)}`;
        }

        const params = new URLSearchParams(window.location.search);
        let user = params.get('user');
        let room = params.get('room');
        let viewerLink = "";

        if(user && room) {
            document.getElementById("setup-modal").style.display = "none";
            
            // Carga tu stream en tu panel de control izquierdo
            document.getElementById("frame-stream").src = `https://player.kick.com/${user}?muted=false`;
            
            // Genera el link inteligente para el chat
            let currentUrl = window.location.origin + window.location.pathname;
            viewerLink = `${currentUrl}?user=${encodeURIComponent(user)}&room=${encodeURIComponent(room)}&viewer=true`;
            document.getElementById("viewer-link-display").innerText = viewerLink;
            
            // Verificamos si quien abrió la página es un viewer o el streamer
            if(params.get('viewer') === 'true') {
                // Modo Espectador Puro: Oculta el panel izquierdo y deja la peli en grande con tu stream arriba a la derecha
                document.querySelector(".left-panel").style.display = "none";
                
                // Carga la película limpia de VDO.Ninja a máxima calidad
                let iframePantalla = document.getElementById("frame-pantalla");
                iframePantalla.src = `https://vdo.ninja/?view=${room}&clean&scale=0&autoplay&quality=0`;
                
                // Muestra el cuadro flotante arriba a la derecha con mayor tamaño
                document.getElementById("promo-container").style.display = "flex";
                document.getElementById("frame-promo-kick").src = `https://player.kick.com/${user}?muted=false`;
                document.getElementById("promo-link").href = `https://kick.com/${user}`;
            } else {
                // Modo Streamer: Inicia preparando la pantalla para compartir
                modoCompartir();
            }
        }

        function modoCompartir() {
            if(!room) return;
            let iframe = document.getElementById("frame-pantalla");
            iframe.setAttribute("allow", "display-capture; fullscreen; autoplay");
            iframe.src = `https://vdo.ninja/?push=${room}&screenshare&autostart&quality=0`;
        }

        function copiarLinkViewer() {
            if(!viewerLink) return;
            navigator.clipboard.writeText(viewerLink).then(() => {
                alert("¡Enlace de Watch Party copiado! Pégalo en tu chat de Kick.");
            });
        }
    </script>
</body>
</html>
