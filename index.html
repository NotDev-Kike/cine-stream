<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - Stream & Pantalla</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #18181b;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d30;
            height: 50px;
        }
        header h1 { font-size: 16px; color: #00ff7f; }
        .config-btn {
            background: #53fc18;
            color: #000;
            border: none;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            overflow: hidden;
        }
        
        /* Panel Izquierdo: Tu cámara / Stream principal de Kick */
        .left-panel {
            width: 25%;
            background-color: #1f1f23;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #2d2d30;
        }
        .stream-box { 
            height: 45%; 
            background: #000; 
            border-bottom: 2px solid #2d2d30;
        }
        .chat-info { 
            flex: 1; 
            padding: 15px; 
            font-size: 13px; 
            color: #adadb8; 
            overflow-y: auto;
        }
        
        /* Panel Central: La pantalla compartida (Stremio / Netflix / PC) */
        .center-panel {
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Panel Derecho: Chat en vivo de Kick ocupando toda la altura */
        .right-panel {
            width: 22%;
            background-color: #18181b;
            border-left: 2px solid #2d2d30;
            display: flex;
            flex-direction: column;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <h1 id="titulo-sala">Watch Party en Vivo</h1>
        <button class="config-btn" onclick="cambiarConfig()">Cambiar Canal / Sala</button>
    </header>

    <div class="main-container">
        
        <!-- 1. Panel Izquierdo: Tu transmisión de Kick (audio/cámara) -->
        <div class="left-panel">
            <div class="stream-box">
                <iframe id="frame-stream" allowfullscreen="true"></iframe>
            </div>
            <div class="chat-info">
                <p>💡 <b>Cómo usar:</b></p><br>
                <p>1. Entra a tu sala de video y comparte la ventana de Stremio o Netflix en el centro.</p><br>
                <p>2. Abre tu directo en Kick hablando con la gente, <b>sin mostrar la película</b> en Kick.</p>
            </div>
        </div>

        <!-- 2. Panel Central: La película en tiempo real (Stremio / Pantalla) -->
        <div class="center-panel">
            <iframe id="frame-pantalla" allow="camera; microphone; display-capture; fullscreen"></iframe>
        </div>

        <!-- 3. Panel Derecho: El Chat en vivo de Kick abarcando todo el alto -->
        <div class="right-panel">
            <iframe id="frame-chat" scrolling="no"></iframe>
        </div>

    </div>

    <script>
        // Parámetros automáticos por URL (Ej: tudominio.com/?user=TuCanal&room=sala123)
        const params = new URLSearchParams(window.location.search);
        let user = params.get('user');
        let room = params.get('room');

        if (!user) {
            user = prompt("Ingresa tu usuario de Kick:") || "tu_usuario";
        }
        if (!room) {
            room = prompt("Ingresa el identificador secreto de la sala de video:") || "sala-default";
        }

        // Asignar rutas a los iframes
        document.getElementById("titulo-sala").innerText = "Sala de Watch Party: " + user;
        document.getElementById("frame-stream").src = `https://player.kick.com/${user}?muted=false`;
        document.getElementById("frame-chat").src = `https://kick.com/${user}/chatroom`;
        
        // Panel central de video compartido en tiempo real
        document.getElementById("frame-pantalla").src = `https://meet.jit.si/${room}#config.startWithAudioMuted=true&config.startWithVideoMuted=true&interfaceConfig.TOOLBAR_BUTTONS=['microphone','camera','desktop','fullscreen']`;

        // Función para cambiar de usuario o sala rápidamente desde el botón
        function cambiarConfig() {
            let nuevoUser = prompt("Nuevo usuario de Kick:", user);
            let nuevaSala = prompt("Nuevo ID de la sala de video:", room);
            if (nuevoUser && nuevaSala) {
                window.location.href = `?user=${encodeURIComponent(nuevoUser)}&room=${encodeURIComponent(nuevaSala)}`;
            }
        }
    </script>
</body>
</html>
